<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0f172a"/>
  <!-- グリッド背景 -->
  <rect x="0" y="0" width="1200" height="630" fill="url(#grid)" opacity="0.05"/>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#6366f1" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- テトリスブロック装飾 左 -->
  <rect x="60" y="180" width="50" height="50" rx="4" fill="#6366f1" opacity="0.8"/>
  <rect x="60" y="240" width="50" height="50" rx="4" fill="#6366f1" opacity="0.8"/>
  <rect x="60" y="300" width="50" height="50" rx="4" fill="#6366f1" opacity="0.8"/>
  <rect x="110" y="300" width="50" height="50" rx="4" fill="#6366f1" opacity="0.8"/>
  <!-- テトリスブロック装飾 右 -->
  <rect x="1090" y="180" width="50" height="50" rx="4" fill="#f97316" opacity="0.8"/>
  <rect x="1040" y="180" width="50" height="50" rx="4" fill="#f97316" opacity="0.8"/>
  <rect x="1040" y="230" width="50" height="50" rx="4" fill="#f97316" opacity="0.8"/>
  <rect x="1040" y="280" width="50" height="50" rx="4" fill="#f97316" opacity="0.8"/>
  <!-- タイトル -->
  <text x="600" y="260" font-family="system-ui, sans-serif" font-size="96" font-weight="900" text-anchor="middle" fill="url(#titleGrad)" letter-spacing="8">TETRIS LAB</text>
  <!-- サブタイトル -->
  <text x="600" y="340" font-family="system-ui, sans-serif" font-size="32" text-anchor="middle" fill="#94a3b8" letter-spacing="4">5 GAME VARIANTS</text>
  <!-- ゲーム名リスト -->
  <text x="600" y="420" font-family="system-ui, sans-serif" font-size="22" text-anchor="middle" fill="#475569">Gravity Flip  ·  Color Match  ·  Slime Block  ·  Mirror  ·  Sprint</text>
  <!-- URL -->
  <text x="600" y="580" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle" fill="#334155">tetris-two-sandy.vercel.app</text>
</svg>
